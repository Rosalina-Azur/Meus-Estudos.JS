<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PARABENS</title>
    <style>
        input {
            margin : 10px;
            font : normal 18pt Arial;
            width: 100px;
        }
        body {
           font: normal 18 Arial;
        }
    </style>
</head>
<body>
    <h1>Parabens</h1>
    <input type="number" name="txtn1" id="txtn1" placeholder="Digite um numero"> +
    <input type="number" name="txtn2" id="txt2" placeholder="Digite outro numero">
    <input type="button" value="Somar" onclick="somar()">
    <div id='resultado'> Resultado
            </div>
    <script>

        function somar(){
            var tn1 = document.getElementById('txtn1')
            var tn2 = document.getElementById('txt2')
            var resultado = document.getElementById('resultado')
            var n1 = Number(tn1.value)
            var n2 = Number(tn2.value)
            var r = n1 + n2
            resultado.innerHTML = `Resultado: ${r}`
        }
    </script>
</body>
</html>
