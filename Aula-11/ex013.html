<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detran</title>
</head>
<body>
    <h1>Sistema de Multas</h1>
    Velocidade do carro: <input type="number" name="txtvel" id="txtvel"> <Km>
    <input type="button" value="verificar" onclick="calcular()">
    <div id = 'res'>

    </div>
   
    <script>
         function calcular() {
            var vel = document.getElementById('txtvel');
            var res = document.getElementById('res');
            var v = Number(vel.value);
        
            if (vel.value > 60) {
               res.innerHTML = `<p>Você esta na velocidade <strong>${v}km/h<strong>!</p>`
                res.innerHTML += '<p>Você foi <strong>multado<strong>!</p>'
            } else {
                res.innerHTML = `<p>Você esta na velocidade <strong>${v}km/h<strong>!</p>`
                res.innerHTML += '<p>Continue dirigindo em segurança!</p>'

            }
        }
    </script>
</body>
</html>
